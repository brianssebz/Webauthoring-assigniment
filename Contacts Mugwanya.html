<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - Mugwanya Complex</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;

            display: flex;

            color: #a04000;
            margin-bottom: 30px;

            margin-bottom: 40px;

        }
        .contact-item {
            margin: 15px 0;

            color: #333333;
        }
        .contact-item strong {

            border-radius: 300px;
        }

        }
