<!DOCTYPE html>
<html>
   
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primary School Admission Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        h2 {

            text-align: center;
            color: #333;
        }
        fieldset {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        legend {
            font-weight: bold;
            color: #0056b3;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #0056b3;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #004085;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Pupil's Admission Form</h2>
     <center><h1>Mugwanya Complex Adimission Form</h1></center>
    <center><label for="passport-photo">Upload Pupil's Passport Photo (JPG/PNG):</label>
<input type="file" id="passport-photo" name="passportPhoto" accept="image/jpeg, image/png" required></center>
    <form action="#" method="POST">
        
        <!-- Student Information -->
        <fieldset>
            <legend>Pupils' Information</legend>
            
            <div class="form-group">
                <label for="fullname">Full Name of Pupil:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="grade">Class you're applying for:</label>
                <select id="grade" name="grade" required>
                    <option value="">Select Class</option>
                    <option value="p1">Primary 1</option>
                    <option value="p2">Primary 2</option>
                    <option value="p3">Primary 3</option>
                    <option value="p4">Primary 4</option>
                    <option value="p5">Primary 5</option>
                    <option value="p6">Primary 6</option>
                    <option value="p7">Primary 7</option>
                </select>
            </div>
            <div class="form-group">
                <label for="grade">Previous Performance (If applicable):</label>
                <input type="text" id="grade" name="grade" required>
                <label for="grade">Former School (If applicable):</label>
                <input type="text" id="school" name="school" required>
                <label for="grade">Alina Ekilwadde Kyonna? Oba Yee, nyonnyola:</label> 
                <textarea id="address" name="address" rows="5" required></textarea>
            </div>
        </fieldset>

        <!-- Parent / Guardian Information -->
        <fieldset>
            <legend>Parent / Guardian Information</legend>
            
            <div class="form-group">
                <label for="parentname">Parent/Guardian Name:</label>
                <input type="text" id="parentname" name="parentname" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
                <label for="grade">Relationship with the Pupil:</label>
                <input type="text" id="Relationship" name="Relationship" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="address">Residential Address:</label>
                <textarea id="address" name="address" rows="3" required></textarea>
                 <label for="nextperson">Next of Kin:</label>
                <input type="text" id="person" name="person" required>
                 <label for="contact">Contact:</label>
                <input type="text" id="contact" name="contact" required>
            </div>
        </fieldset>

        <button type="submit">Submit Application</button>
    </form>
</div>

</body>
</html>
